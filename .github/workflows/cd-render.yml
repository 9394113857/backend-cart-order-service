# =====================================================
# 🚀 CD - Cart Order Service Render (FINAL PRODUCTION)
# =====================================================

name: 🚀 CD - Cart Order Service Render

run-name: 🚀 Deploy ${{ github.event_name }} | ${{ github.ref_name }} | ${{ github.actor }}


on:

  workflow_dispatch:


  schedule:

    # 2:00 AM IST
    - cron: "30 20 * * *"



jobs:


  deploy:


    name: 🚀 Deploy Cart Order Service


    runs-on: ubuntu-latest



    steps:



      # =====================================================
      # 📦 CHECKOUT
      # =====================================================

      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          fetch-tags: true




      # =====================================================
      # 🏷️ VERSION METADATA
      # =====================================================

      - name: Detect Deployment Metadata

        run: |


          TAGS=($(git tag --sort=-v:refname))


          if [ ${#TAGS[@]} -eq 0 ]

          then

            VERSION="latest"

          else

            VERSION=${TAGS[0]}

          fi



          echo "VERSION=$VERSION" >> $GITHUB_ENV


          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV


          echo "BRANCH=main" >> $GITHUB_ENV



          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV


          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV



          echo "SERVICE_URL=https://backend-cart-order-service-q6qh.onrender.com" >> $GITHUB_ENV



          echo "🚀 Version: $VERSION"




      # =====================================================
      # 🚀 RENDER DEPLOY
      # =====================================================

      - name: Trigger Render Deploy

        run: |


          echo "🚀 Triggering Render Deployment..."


          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"




      # =====================================================
      # ⏳ WAIT
      # =====================================================

      - name: Wait For Startup

        run: |


          echo "Waiting for application startup..."


          sleep 30




      # =====================================================
      # ❤️ HEALTH CHECK
      # =====================================================

      - name: Health Check


        run: |


          echo "🔍 Checking Cart Service Health..."


          for i in {1..10}

          do


            STATUS=$(curl -s \
            -o /dev/null \
            -w "%{http_code}" \
            "${{ secrets.APPLICATION_HEALTH_URL }}")


            echo "Attempt $i → HTTP $STATUS"



            if [ "$STATUS" = "200" ]

            then


              echo "🟢 Cart Service Healthy"

              echo "DEPLOY_STATUS=SUCCESS" >> $GITHUB_ENV

              exit 0


            fi



            sleep 10


          done



          echo "DEPLOY_STATUS=FAILED" >> $GITHUB_ENV


          echo "🔴 Health check failed"


          exit 1





      # =====================================================
      # 📧 SUCCESS EMAIL
      # =====================================================

      - name: 📧 Deployment Success Email


        if: success()


        uses: dawidd6/action-send-mail@v3


        with:


          server_address: smtp.gmail.com


          server_port: 587


          username: ${{ secrets.MAIL_USERNAME_MAIN }}


          password: ${{ secrets.MAIL_PASSWORD_MAIN }}


          subject: "🚀 CD SUCCESS | Cart Order Service ${{ env.VERSION }}"


          to: ${{ secrets.MAIL_USERNAME_MAIN }}


          cc: ${{ secrets.MAIL_TO_CC_MAIN }}


          from: ${{ secrets.MAIL_USERNAME_MAIN }}



          body: |


            🚀 DEPLOYMENT SUCCESS


            Service:
            Cart Order Service


            URL:
            ${{ env.SERVICE_URL }}


            Version:
            ${{ env.VERSION }}


            Commit:
            ${{ env.COMMIT }}


            Branch:
            ${{ env.BRANCH }}


            Trigger:
            ${{ github.event_name }}


            Triggered By:
            ${{ github.actor }}


            Deploy Time UTC:
            ${{ env.DEPLOY_TIME_UTC }}


            Deploy Time IST:
            ${{ env.DEPLOY_TIME_IST }}


            Health:
            ${{ env.DEPLOY_STATUS }}






      # =====================================================
      # ❌ FAILURE EMAIL
      # =====================================================

      - name: ❌ Deployment Failure Email


        if: failure()


        uses: dawidd6/action-send-mail@v3


        with:


          server_address: smtp.gmail.com


          server_port: 587


          username: ${{ secrets.MAIL_USERNAME_MAIN }}


          password: ${{ secrets.MAIL_PASSWORD_MAIN }}



          subject: "🚨 CD FAILED | Cart Order Service"



          to: ${{ secrets.MAIL_USERNAME_MAIN }}


          cc: ${{ secrets.MAIL_TO_CC_MAIN }}


          from: ${{ secrets.MAIL_USERNAME_MAIN }}



          body: |


            🚨 DEPLOYMENT FAILED


            Service:
            Cart Order Service


            Version:
            ${{ env.VERSION }}


            Commit:
            ${{ github.sha }}


            Branch:
            ${{ env.BRANCH }}


            Trigger:
            ${{ github.event_name }}


            Please check:

            ❌ GitHub Actions logs

            ❌ Render logs

            ❌ /health endpoint
