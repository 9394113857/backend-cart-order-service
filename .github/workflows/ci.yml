```yaml id="m9k2xp"
# =====================================================
# 🚀 CI - Backend Cart Service (FINAL WITH TESTS)
# =====================================================

name: 🚀 CI - Backend Cart Service

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ===============================
      # 🟢 Checkout
      # ===============================
      - name: Checkout
        uses: actions/checkout@v3

      # ===============================
      # 🟢 Setup Python
      # ===============================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # ===============================
      # 📦 Install Dependencies
      # ===============================
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # ===============================
      # 🧪 Run Tests (CRITICAL)
      # ===============================
      - name: Run Tests
        run: |
          pytest --maxfail=1 --disable-warnings -v

      # ===============================
      # 🟢 Set Version Info
      # ===============================
      - name: Set Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            TYPE="TAG"
            NAME=$VERSION
            BRANCH="release"
          else
            VERSION=dev-${GITHUB_SHA}
            TYPE="BRANCH"
            NAME=${GITHUB_REF#refs/heads/}
            BRANCH=$NAME
          fi

          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "APP_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "TYPE=$TYPE" >> $GITHUB_ENV
          echo "NAME=$NAME" >> $GITHUB_ENV

          echo "REPO=https://github.com/9394113857/backend-cart-order-service" >> $GITHUB_ENV

      # ===============================
      # 🔐 Docker Login
      # ===============================
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # ===============================
      # 🐳 Build Docker Image
      # ===============================
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg APP_VERSION=${APP_VERSION} \
            --build-arg APP_COMMIT=${APP_COMMIT} \
            --build-arg APP_BRANCH=${APP_BRANCH} \
            -t pythoncodelife/backend-cart-order-service:${APP_VERSION} .

      # ===============================
      # 🏷️ Tag latest (only main)
      # ===============================
      - name: Tag latest
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          docker tag pythoncodelife/backend-cart-order-service:${APP_VERSION} pythoncodelife/backend-cart-order-service:latest

      # ===============================
      # 🚀 Push Docker Image
      # ===============================
      - name: Push Docker Image
        run: |
          docker push pythoncodelife/backend-cart-order-service:${APP_VERSION}

      # ===============================
      # 🚀 Push latest
      # ===============================
      - name: Push latest
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          docker push pythoncodelife/backend-cart-order-service:latest

      # ===============================
      # 📧 Email Success
      # ===============================
      - name: 📧 Email Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚀 CI SUCCESS - ${{ env.NAME }}"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          cc: ${{ secrets.MAIL_TO_CC_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚀 CI BUILD SUCCESS on Cart Service

            📌 Type: ${{ env.TYPE }}
            🏷️ Name: ${{ env.NAME }}

            🔑 Commit:
            ${{ env.APP_COMMIT }}

            🌿 Branch:
            ${{ env.APP_BRANCH }}

            🐳 Docker Image:
            pythoncodelife/backend-cart-order-service:${{ env.APP_VERSION }}

            🔗 Repo:
            ${{ env.REPO }}

            ✅ Tests Passed + Image pushed successfully

      # ===============================
      # ❌ Email Failure
      # ===============================
      - name: ❌ Email Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚨 CI FAILED - ${{ env.NAME }}"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          cc: ${{ secrets.MAIL_TO_CC_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚨 CI BUILD FAILED

            📌 Type: ${{ env.TYPE }}
            🏷️ Name: ${{ env.NAME }}

            🔑 Commit:
            ${{ env.APP_COMMIT }}

            🌿 Branch:
            ${{ env.APP_BRANCH }}

            🔗 Repo:
            ${{ env.REPO }}

            🔧 Check GitHub Actions logs immediately
```
